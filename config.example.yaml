# agent-gateway configuration.
# Copy to config.yaml and adjust. Values can also be set via .env or environment
# variables (e.g. GATEWAY_HTTP_ADDR). Environment variables take precedence.

server:
  http_addr: ":8080"    # REST / dashboard endpoint
  grpc_addr: ":9090"    # internal gRPC endpoint
  read_timeout: 30s
  write_timeout: 60s

ollama:
  base_url: "http://localhost:11434" # Ollama endpoint for Layer 1
  model: "qwen2.5:0.5b"              # local small LLM used as intent classifier
  request_timeout: 5s
  # Keep 0.5m close to zero so the sample is meaningful:
  retry_attempts: 1

# Layer 2: online LLM backends for escalated (complex) intents.
# New providers (openai, bedrock, ...) plug in behind the same interface;
# add an entry here and implement the type in internal/layer2.
layer2:
  default_provider: "opencode"   # escalated prompts route here by default
  request_timeout: 60s           # per upstream call budget
  retry_attempts: 1              # retries after the first attempt
  providers:
    opencode:                    # opencode serve instance
      type: "opencode"           # backend implementation
      base_url: "http://localhost:4096"
      model: "opencode/deepseek-v4-flash-free" # providerID/modelID

worker_pool:
  size: 16          # concurrent Layer 1 classify jobs
  queue_size: 256   # pending job queue

circuit_breaker:
  failure_threshold: 3   # trips after this many consecutive failures
  cooldown: 30s          # time to wait before allowing a probe

metrics:
  window: 10m    # rolling window for latency/percentile calculations
  max_samples: 10000
  request_log_size: 200

dashboard:
  enabled: true
